<html lang="pt-br">

    <meta name="mobile-web-app-capable" content="yes">

    <title>Universo Mia</title>

    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: rgba(22, 22, 29, 0.8);
            --accent: #8e24aa;
            --accent-light: #bb86fc;
            --text: #e0e0e0;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; 
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            animation: stars-move 100s linear infinite;
        }

        @keyframes stars-move {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }

        h1 { 
            font-family: 'Dancing Script', cursive; 
            font-size: 3.5rem; 
            color: var(--accent-light); 
            margin: 0;
            text-shadow: 0 0 15px rgba(187, 134, 252, 0.5);
        }

        .subtitle { 
            font-size: 0.85rem; 
            opacity: 0.8; 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(142, 36, 170, 0.3);
            border-radius: 24px;
            padding: 25px 15px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card i {
            font-size: 2rem;
            margin-bottom: 12px;
            color: var(--accent-light);
        }

        .card span {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .card:active { 
            transform: scale(0.9); 
            border-color: var(--accent-light);
            background: rgba(142, 36, 170, 0.2);
        }

        #content-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 1000;
            display: none;
            padding: 40px 25px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .slide-up { animation: slideUp 0.5s forwards; }
        .slide-down { animation: slideDown 0.5s forwards; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }

        .close-btn { 
            position: fixed; 
            top: 20px; 
            right: 25px; 
            font-size: 1.8rem; 
            color: var(--accent-light); 
            background: var(--glass);
            width: 45px; height: 45px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 1001;
        }

        .intro-text {
            font-style: italic;
            color: var(--accent-light);
            border-left: 4px solid var(--accent);
            padding-left: 15px;
            margin-bottom: 30px;
            font-size: 1.2rem;
            line-height: 1.4;
        }

        .main-text { 
            line-height: 1.8; 
            font-size: 1.05rem; 
            opacity: 0.95; 
            text-align: left;
            padding-bottom: 100px;
        }

        .btn-random {
            background: linear-gradient(45deg, var(--accent), var(--accent-light));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            margin-top: 20px;
            font-family: 'Poppins';
            font-weight: 600;
            width: 100%;
            box-shadow: 0 5px 15px rgba(142, 36, 170, 0.4);
        }

        .carta-container {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 20px;
            border: 1px dashed var(--accent);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            transition: opacity 0.3s;
        }

        .respiro-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .btn-respira {
            width: 150px; height: 150px;
            border-radius: 50%; 
            background: radial-gradient(circle, var(--accent-light), var(--accent));
            box-shadow: 0 0 30px var(--accent);
            animation: pulse 8s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        @keyframes pulse { 
            0%, 100% { transform: scale(1); opacity: 0.5; box-shadow: 0 0 20px var(--accent); } 
            50% { transform: scale(1.6); opacity: 1; box-shadow: 0 0 50px var(--accent-light); } 
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        function openTab(id) {
            const data = tabs[id];
            let html = `<div class="intro-text">${data.intro}</div><div class="main-text">${data.body}</div>`;
            document.getElementById('display-area').innerHTML = html;
            
            const overlay = document.getElementById('content-overlay');
            overlay.classList.remove('slide-down');
            overlay.classList.add('slide-up');
            overlay.style.display = 'block';
            overlay.scrollTop = 0;
            
            history.pushState({tabOpen: true}, "");
        }

        function closeTab() {
            const overlay = document.getElementById('content-overlay');
            overlay.classList.remove('slide-up');
            overlay.classList.add('slide-down');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        }

        window.onpopstate = function() {
            closeTab();
        };

        function gerarCarta() {

            container.style.opacity = 0;

            }, 300);
